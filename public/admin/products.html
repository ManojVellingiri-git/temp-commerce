<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Products · Gurkhahills Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
renderShell("products.html", "Products");

let editId = null;
let filterText = "";
let filterCat = "all";

function productRows(){
  return DB.products.filter(p =>
    (filterCat==="all" || p.category===filterCat) &&
    (p.name.toLowerCase().includes(filterText) || p.sku.toLowerCase().includes(filterText))
  );
}

function renderThumb(p){
  if (p.image) {
    return `<img src="${p.image}" alt="${p.name}" class="thumb-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="thumb" style="display:none">${p.icon||'📦'}</div>`;
  }
  return `<div class="thumb">${p.icon||'📦'}</div>`;
}

function renderTable(){
  const rows = productRows();
  document.getElementById("tbody").innerHTML = rows.length ? rows.map(p => `
    <tr>
      <td>
        <div class="cell-prod">
          ${renderThumb(p)}
          <div>
            <div class="nm">${p.name}</div>
            <div class="sub">
              ${p.sku} 
              ${(p.image && (p.image.includes('.r2.dev') || p.image.includes('pub-r2') || p.image.includes('cloudflare'))) ? '<span style="font-size:10px;color:#f6821f;font-weight:700">☁ R2</span>' : ''}
            </div>
          </div>
        </div>
      </td>
      <td>${p.category}</td>
      <td>${fmtMoney(p.price)}</td>
      <td>${p.stock}</td>
      <td>${statusPill(p.status)}</td>
      <td>
        <div class="row-actions">
          <button class="icon-mini" onclick="openEdit('${p.id}')" title="Edit">${ICONS.edit}</button>
          <button class="icon-mini" onclick="removeProduct('${p.id}')" title="Delete">${ICONS.trash}</button>
        </div>
      </td>
    </tr>
  `).join("") : `<tr><td colspan="6"><div class="empty-state"><div class="big-icon">📦</div>No products match your filters.</div></td></tr>`;
  document.getElementById("countLabel").textContent = `${rows.length} of ${DB.products.length} products`;
}

function updateImgPreview(url){
  const img = document.getElementById("imgPreview");
  const span = document.getElementById("imgPreviewPlaceholder");
  const box = document.getElementById("imgPreviewBox");
  if (!img || !span || !box) return;
  if (!url) {
    img.style.display = "none";
    img.src = "";
    span.style.display = "block";
    box.classList.remove("has-img");
    return;
  }
  img.onload = () => {
    img.style.display = "block";
    span.style.display = "none";
    box.classList.add("has-img");
  };
  img.onerror = () => {
    img.style.display = "none";
    span.style.display = "block";
    box.classList.remove("has-img");
  };
  img.src = url;
}

function setPresetImg(url){
  const el = document.getElementById("f_image");
  if (el) {
    el.value = url;
    updateImgPreview(url);
  }
}

function applyCloudflarePrefix(){
  const el = document.getElementById("f_image");
  if (!el) return;
  let val = el.value.trim();
  const cfDomain = (DB.cloudflare && DB.cloudflare.r2PublicDomain) ? DB.cloudflare.r2PublicDomain.replace(/\/+$/, '') : 'https://pub-r2.gurkhahills.com';
  if (!val) {
    el.value = `${cfDomain}/products/sample.webp`;
  } else if (!val.startsWith("http://") && !val.startsWith("https://")) {
    const key = val.startsWith("/") ? val.slice(1) : val;
    el.value = `${cfDomain}/${key}`;
  }
  updateImgPreview(el.value);
  showToast("Attached Cloudflare R2 CDN prefix");
}

function handleFileUpload(e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;

  const cfDomain = (DB.cloudflare && DB.cloudflare.r2PublicDomain) ? DB.cloudflare.r2PublicDomain.replace(/\/+$/, '') : 'https://pub-r2.gurkhahills.com';
  const uploadEndpoint = DB.cloudflare ? DB.cloudflare.uploadEndpoint : '';

  if (uploadEndpoint) {
    showToast("Uploading image to Cloudflare R2...");
    const formData = new FormData();
    formData.append("file", file);

    fetch(uploadEndpoint, {
      method: "POST",
      body: formData
    })
    .then(r => r.json())
    .then(data => {
      if (data.url) {
        document.getElementById("f_image").value = data.url;
        updateImgPreview(data.url);
        showToast("Uploaded successfully to Cloudflare R2!");
      } else {
        throw new Error(data.error || "Upload failed");
      }
    })
    .catch(err => {
      // Fallback to local preview & R2 key formatting
      const reader = new FileReader();
      reader.onload = (evt) => {
        updateImgPreview(evt.target.result);
        const safeName = file.name.toLowerCase().replace(/[^a-z0-9._-]/g, '-');
        document.getElementById("f_image").value = `${cfDomain}/products/${safeName}`;
        showToast("R2 key generated. Worker unreachable—check CORS or endpoint.");
      };
      reader.readAsDataURL(file);
    });
  } else {
    // Immediate preview and generate full Cloudflare R2 URL
    const reader = new FileReader();
    reader.onload = (evt) => {
      updateImgPreview(evt.target.result);
      const safeName = file.name.toLowerCase().replace(/[^a-z0-9._-]/g, '-');
      document.getElementById("f_image").value = `${cfDomain}/products/${safeName}`;
      showToast(`Assigned Cloudflare R2 URL for ${file.name}`);
    };
    reader.readAsDataURL(file);
  }
}

function openEdit(id){
  editId = id;
  const p = DB.products.find(x=>x.id===id);
  document.getElementById("modalTitle").textContent = p ? "Edit product" : "Add product";
  document.getElementById("f_name").value = p ? p.name : "";
  document.getElementById("f_sku").value = p ? p.sku : "SKU-" + Math.floor(Math.random()*9000+1000);
  document.getElementById("f_category").value = p ? p.category : DB.categories[0].name;
  document.getElementById("f_price").value = p ? p.price : "";
  document.getElementById("f_stock").value = p ? p.stock : "";
  document.getElementById("f_status").value = p ? p.status : "active";
  const imgVal = p ? (p.image || "") : "";
  document.getElementById("f_image").value = imgVal;
  updateImgPreview(imgVal);
  document.getElementById("modalOverlay").classList.add("open");
}

function closeModal(){ document.getElementById("modalOverlay").classList.remove("open"); }

function saveProduct(e){
  e.preventDefault();
  const payload = {
    name: document.getElementById("f_name").value.trim(),
    sku: document.getElementById("f_sku").value.trim(),
    category: document.getElementById("f_category").value,
    price: Number(document.getElementById("f_price").value || 0),
    stock: Number(document.getElementById("f_stock").value || 0),
    status: document.getElementById("f_status").value,
    image: document.getElementById("f_image").value.trim() || "/images/prod_mango.webp",
    icon: "🛒"
  };
  if (!payload.name) return;
  if (editId) {
    const p = DB.products.find(x=>x.id===editId);
    if (p) {
      Object.assign(p, payload);
      p.originalPrice = p.originalPrice || Math.round(p.price * 1.2);
      p.badge = p.status === "low" ? "Low Stock" : (p.status === "out" ? "Sold Out" : (p.badge || "Fresh"));
    }
    showToast("Product updated and synced with Storefront");
  } else {
    payload.id = "fc-" + Date.now().toString().slice(-4);
    payload.subtitle = `${payload.category} • Fresh Selection`;
    payload.weight = "1 Pack";
    payload.weightOptions = ["1 Pack"];
    payload.originalPrice = Math.round(payload.price * 1.2);
    payload.discount = "15% OFF";
    payload.badge = payload.status === "low" ? "Low Stock" : (payload.status === "out" ? "Sold Out" : "Fresh");
    payload.rating = 4.9;
    payload.reviews = 1;
    payload.isOrganic = payload.category === "Organic Products";
    payload.isBestSeller = false;
    payload.harvestTime = "Fresh Today";
    payload.description = payload.name;
    DB.products.unshift(payload);
    showToast("Product added and published to Storefront");
  }
  persist();
  closeModal();
  renderTable();
}

function removeProduct(id){
  if (!confirm("Delete this product? This can't be undone.")) return;
  DB.products = DB.products.filter(p=>p.id!==id);
  persist();
  renderTable();
  showToast("Product deleted");
}

const currentCfDomain = (DB.cloudflare && DB.cloudflare.r2PublicDomain) ? DB.cloudflare.r2PublicDomain.replace(/\/+$/, '') : 'https://pub-r2.gurkhahills.com';

document.getElementById("pageContent").innerHTML = `
  <div class="page-head">
    <div>
      <div class="crumbs">Catalog / Products</div>
      <h1>Products</h1>
      <p>Manage your catalog, Cloudflare R2 images, pricing and stock levels.</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="btn sm" href="settings.html" style="color:var(--muted)">☁️ Cloudflare Settings</a>
      <button class="btn primary" onclick="openEdit(null)">${ICONS.plus} Add product</button>
    </div>
  </div>

  <div class="panel">
    <div class="table-toolbar">
      <div class="search-sm">${ICONS.search}<input id="searchInput" placeholder="Search by name or SKU…"></div>
      <select class="select-sm" id="catFilter">
        <option value="all">All categories</option>
        ${DB.categories.map(c=>`<option value="${c.name}">${c.name}</option>`).join("")}
      </select>
      <span style="margin-left:auto;font-size:12.5px;color:var(--muted)" id="countLabel"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="m-head">
        <h3 id="modalTitle">Add product</h3>
        <button class="close-x" onclick="closeModal()">${ICONS.close}</button>
      </div>
      <form id="productForm" onsubmit="saveProduct(event)">
        <div class="m-body">
          <div class="field"><label>Product name</label><input type="text" id="f_name" required></div>
          <div class="field-row">
            <div class="field"><label>SKU</label><input type="text" id="f_sku"></div>
            <div class="field"><label>Category</label>
              <select id="f_category">${DB.categories.map(c=>`<option>${c.name}</option>`).join("")}</select>
            </div>
          </div>
          <div class="field-row">
            <div class="field"><label>Price (${DB.store.currency})</label><input type="number" id="f_price" min="0" required></div>
            <div class="field"><label>Stock quantity</label><input type="number" id="f_stock" min="0" required></div>
          </div>
          <div class="field"><label>Status</label>
            <select id="f_status">
              <option value="active">Active</option>
              <option value="draft">Draft</option>
              <option value="low">Low stock</option>
              <option value="out">Out of stock</option>
            </select>
          </div>

          <div class="field">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
              <label style="margin:0">Product Image URL / Cloudflare R2 Storage</label>
              <span style="font-size:11px;color:#f6821f;font-weight:700">☁️ Cloudflare Connected</span>
            </div>

            <div style="display:flex;gap:12px;align-items:flex-start">
              <div id="imgPreviewBox" class="img-preview-box">
                <span id="imgPreviewPlaceholder">📦</span>
                <img id="imgPreview" src="" alt="Preview" style="display:none">
              </div>

              <div style="flex:1">
                <input type="text" id="f_image" placeholder="${currentCfDomain}/products/mango.webp">
                
                <div style="display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap">
                  <label class="btn sm" style="cursor:pointer;padding:5px 9px;font-size:11.5px">
                    <input type="file" id="f_image_file" accept="image/*" style="display:none" onchange="handleFileUpload(event)">
                    <span>📁 Upload to Cloudflare R2</span>
                  </label>

                  <button type="button" class="btn sm" onclick="applyCloudflarePrefix()" style="padding:5px 9px;font-size:11.5px">
                    <span>☁️ Attach R2 Domain</span>
                  </button>
                </div>

                <div class="hint" style="margin-top:6px">
                  Connected to: <code>${currentCfDomain}</code>
                </div>

                <div class="url-chips">
                  <span class="url-chip" onclick="setPresetImg('${currentCfDomain}/products/alphonso-mango.webp')">🥭 R2 Mango</span>
                  <span class="url-chip" onclick="setPresetImg('${currentCfDomain}/products/strawberries.webp')">🍓 R2 Berries</span>
                  <span class="url-chip" onclick="setPresetImg('${currentCfDomain}/products/avocado.webp')">🥑 R2 Avocado</span>
                  <span class="url-chip" onclick="setPresetImg('${currentCfDomain}/products/organic-tomatoes.webp')">🍅 R2 Tomato</span>
                  <span class="url-chip" onclick="setPresetImg('${currentCfDomain}/products/farm-milk.webp')">🥛 R2 Milk</span>
                  <span class="url-chip" onclick="setPresetImg('${currentCfDomain}/products/norwegian-salmon.webp')">🐟 R2 Salmon</span>
                  <span class="url-chip" onclick="setPresetImg('/images/prod_mango.webp')">Local Mango</span>
                  <span class="url-chip" onclick="setPresetImg('/images/prod_sourdough.webp')">Local Sourdough</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="m-foot">
          <button type="button" class="btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn primary">Save product</button>
        </div>
      </form>
    </div>
  </div>
`;

// Wire live typing in Image URL field to live preview
const imgInput = document.getElementById("f_image");
if (imgInput) {
  imgInput.addEventListener("input", (e) => updateImgPreview(e.target.value.trim()));
}

// URL Search parameter support (e.g. ?q=organic)
const urlParams = new URLSearchParams(window.location.search);
const initialQuery = urlParams.get("q") || urlParams.get("search");
if (initialQuery) {
  filterText = initialQuery.toLowerCase();
  const searchEl = document.getElementById("searchInput");
  if (searchEl) searchEl.value = initialQuery;
  const globalEl = document.getElementById("globalSearch");
  if (globalEl) globalEl.value = initialQuery;
}

renderTable();
document.getElementById("searchInput").addEventListener("input", e=>{ filterText = e.target.value.toLowerCase(); renderTable(); });
document.getElementById("catFilter").addEventListener("change", e=>{ filterCat = e.target.value; renderTable(); });
</script>
</body>
</html>
