<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customers · Gurkhahills Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
renderShell("customers.html", "Customers");

let search = "";
function rows(){
  return DB.customers.filter(c => c.name.toLowerCase().includes(search) || c.email.toLowerCase().includes(search));
}

function toggleBlock(id){
  const c = DB.customers.find(x=>x.id===id);
  c.status = c.status==="active" ? "blocked" : "active";
  persist();
  renderTable();
  showToast(c.status==="blocked" ? `${c.name} blocked` : `${c.name} unblocked`);
}

function renderTable(){
  const list = rows();
  document.getElementById("tbody").innerHTML = list.length ? list.map(c => `
    <tr>
      <td>
        <div class="cell-prod">
          <div class="avatar">${initials(c.name)}</div>
          <div><div class="nm">${c.name}</div><div class="sub">${c.email}</div></div>
        </div>
      </td>
      <td>${c.orders}</td>
      <td>${fmtMoney(c.spent)}</td>
      <td>${c.joined}</td>
      <td>${statusPill(c.status)}</td>
      <td>
        <div class="row-actions">
          <button class="icon-mini" title="${c.status==='active'?'Block':'Unblock'}" onclick="toggleBlock('${c.id}')">${c.status==="active" ? ICONS.trash : ICONS.eye}</button>
        </div>
      </td>
    </tr>
  `).join("") : `<tr><td colspan="6"><div class="empty-state"><div class="big-icon">👤</div>No customers found.</div></td></tr>`;
  document.getElementById("countLabel").textContent = `${list.length} of ${DB.customers.length} customers`;
}

document.getElementById("pageContent").innerHTML = `
  <div class="page-head">
    <div>
      <div class="crumbs">Sales / Customers</div>
      <h1>Customers</h1>
      <p>See who's shopping with you and manage access.</p>
    </div>
  </div>

  <div class="panel">
    <div class="table-toolbar">
      <div class="search-sm">${ICONS.search}<input id="searchInput" placeholder="Search by name or email…"></div>
      <span style="margin-left:auto;font-size:12.5px;color:var(--muted)" id="countLabel"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Customer</th><th>Orders</th><th>Total spent</th><th>Joined</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
`;

// URL Search parameter support (e.g. ?q=ananya)
const urlParams = new URLSearchParams(window.location.search);
const initialQuery = urlParams.get("q") || urlParams.get("search");
if (initialQuery) {
  search = initialQuery.toLowerCase();
  const searchEl = document.getElementById("searchInput");
  if (searchEl) searchEl.value = initialQuery;
  const globalEl = document.getElementById("globalSearch");
  if (globalEl) globalEl.value = initialQuery;
}

renderTable();
document.getElementById("searchInput").addEventListener("input", e=>{ search = e.target.value.toLowerCase(); renderTable(); });
</script>
</body>
</html>
