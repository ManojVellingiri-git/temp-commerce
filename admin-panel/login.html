<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Login · Gurkhahills Shopping Complex</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div style="margin-bottom:16px;">
      <img src="/gurkhacamp-logo.png" alt="Gurkhahills" style="height:54px;width:auto;object-fit:contain;">
    </div>
    <h1>Gurkhahills Admin</h1>
    <p class="sub">Sign in to manage products, orders & customers.</p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="admin@gurkhahills.com" value="admin@gurkhahills.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" value="admin123" required>
      </div>
      <button class="btn primary" type="submit">Sign in</button>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12px;">
        <span class="hint" style="margin:0">Demo build — any credentials work</span>
        <a href="/" style="color:var(--green-800);font-weight:600;text-decoration:none">&larr; Return to store</a>
      </div>
    </form>
  </div>
</div>
<div class="login-foot" style="position:fixed;bottom:16px;width:100%;left:0">
  &copy; <span id="yr"></span> Gurkhahills Shopping Complex — Admin Panel
</div>
<script>
  document.getElementById("yr").textContent = new Date().getFullYear();
  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    sessionStorage.setItem("gc_admin_session", JSON.stringify({
      email: document.getElementById("email").value,
      ts: Date.now()
    }));
    location.href = "index.html";
  });
</script>
</body>
</html>
