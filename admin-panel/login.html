<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Login · Gurkhacamp Shopping Complex</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div style="margin-bottom:16px;">
      <img src="/gurkhacamp-logo.png" alt="Gurkhacamp" style="height:54px;width:auto;object-fit:contain;">
    </div>
    <h1>Gurkhacamp Admin</h1>
    <p class="sub">Sign in to manage products, orders & customers.</p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="admin@gurkhacamp.com" value="admin@gurkhacamp.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" value="admin123" required>
      </div>
      <button class="btn primary" type="submit">Sign in</button>
      <p class="hint" style="text-align:center;margin-top:12px">Demo build — any email/password combination works.</p>
    </form>
  </div>
</div>
<div class="login-foot" style="position:fixed;bottom:16px;width:100%;left:0">
  &copy; <span id="yr"></span> Gurkhacamp Shopping Complex — Admin Panel
</div>
<script>
  document.getElementById("yr").textContent = new Date().getFullYear();
  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    sessionStorage.setItem("gc_admin_session", JSON.stringify({
      email: document.getElementById("email").value,
      ts: Date.now()
    }));
    location.href = "index.html";
  });
</script>
</body>
</html>
