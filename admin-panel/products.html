<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Products · Gurkhahills Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
renderShell("products.html", "Products");

let editId = null;
let filterText = "";
let filterCat = "all";

function productRows(){
  return DB.products.filter(p =>
    (filterCat==="all" || p.category===filterCat) &&
    (p.name.toLowerCase().includes(filterText) || p.sku.toLowerCase().includes(filterText))
  );
}

function renderThumb(p){
  if (p.image) {
    return `<img src="${p.image}" alt="${p.name}" class="thumb-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="thumb" style="display:none">${p.icon||'📦'}</div>`;
  }
  return `<div class="thumb">${p.icon||'📦'}</div>`;
}

function renderTable(){
  const rows = productRows();
  document.getElementById("tbody").innerHTML = rows.length ? rows.map(p => `
    <tr>
      <td>
        <div class="cell-prod">
          ${renderThumb(p)}
          <div><div class="nm">${p.name}</div><div class="sub">${p.sku}</div></div>
        </div>
      </td>
      <td>${p.category}</td>
      <td>${fmtMoney(p.price)}</td>
      <td>${p.stock}</td>
      <td>${statusPill(p.status)}</td>
      <td>
        <div class="row-actions">
          <button class="icon-mini" onclick="openEdit('${p.id}')" title="Edit">${ICONS.edit}</button>
          <button class="icon-mini" onclick="removeProduct('${p.id}')" title="Delete">${ICONS.trash}</button>
        </div>
      </td>
    </tr>
  `).join("") : `<tr><td colspan="6"><div class="empty-state"><div class="big-icon">📦</div>No products match your filters.</div></td></tr>`;
  document.getElementById("countLabel").textContent = `${rows.length} of ${DB.products.length} products`;
}

function updateImgPreview(url){
  const img = document.getElementById("imgPreview");
  const span = document.getElementById("imgPreviewPlaceholder");
  const box = document.getElementById("imgPreviewBox");
  if (!img || !span || !box) return;
  if (!url) {
    img.style.display = "none";
    img.src = "";
    span.style.display = "block";
    box.classList.remove("has-img");
    return;
  }
  img.onload = () => {
    img.style.display = "block";
    span.style.display = "none";
    box.classList.add("has-img");
  };
  img.onerror = () => {
    img.style.display = "none";
    span.style.display = "block";
    box.classList.remove("has-img");
  };
  img.src = url;
}

function setPresetImg(url){
  const el = document.getElementById("f_image");
  if (el) {
    el.value = url;
    updateImgPreview(url);
  }
}

function openEdit(id){
  editId = id;
  const p = DB.products.find(x=>x.id===id);
  document.getElementById("modalTitle").textContent = p ? "Edit product" : "Add product";
  document.getElementById("f_name").value = p ? p.name : "";
  document.getElementById("f_sku").value = p ? p.sku : "SKU-" + Math.floor(Math.random()*9000+1000);
  document.getElementById("f_category").value = p ? p.category : DB.categories[0].name;
  document.getElementById("f_price").value = p ? p.price : "";
  document.getElementById("f_stock").value = p ? p.stock : "";
  document.getElementById("f_status").value = p ? p.status : "active";
  const imgVal = p ? (p.image || "") : "";
  document.getElementById("f_image").value = imgVal;
  updateImgPreview(imgVal);
  document.getElementById("modalOverlay").classList.add("open");
}

function closeModal(){ document.getElementById("modalOverlay").classList.remove("open"); }

function saveProduct(e){
  e.preventDefault();
  const payload = {
    name: document.getElementById("f_name").value.trim(),
    sku: document.getElementById("f_sku").value.trim(),
    category: document.getElementById("f_category").value,
    price: Number(document.getElementById("f_price").value || 0),
    stock: Number(document.getElementById("f_stock").value || 0),
    status: document.getElementById("f_status").value,
    image: document.getElementById("f_image").value.trim(),
    icon: "🛒"
  };
  if (!payload.name) return;
  if (editId) {
    const p = DB.products.find(x=>x.id===editId);
    Object.assign(p, payload);
    showToast("Product updated");
  } else {
    payload.id = "P-" + Math.floor(Math.random()*9000+1000);
    DB.products.unshift(payload);
    showToast("Product added");
  }
  persist();
  closeModal();
  renderTable();
}

function removeProduct(id){
  if (!confirm("Delete this product? This can't be undone.")) return;
  DB.products = DB.products.filter(p=>p.id!==id);
  persist();
  renderTable();
  showToast("Product deleted");
}

document.getElementById("pageContent").innerHTML = `
  <div class="page-head">
    <div>
      <div class="crumbs">Catalog / Products</div>
      <h1>Products</h1>
      <p>Manage your catalog, images, pricing and stock levels.</p>
    </div>
    <button class="btn primary" onclick="openEdit(null)">${ICONS.plus} Add product</button>
  </div>

  <div class="panel">
    <div class="table-toolbar">
      <div class="search-sm">${ICONS.search}<input id="searchInput" placeholder="Search by name or SKU…"></div>
      <select class="select-sm" id="catFilter">
        <option value="all">All categories</option>
        ${DB.categories.map(c=>`<option value="${c.name}">${c.name}</option>`).join("")}
      </select>
      <span style="margin-left:auto;font-size:12.5px;color:var(--muted)" id="countLabel"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="m-head">
        <h3 id="modalTitle">Add product</h3>
        <button class="close-x" onclick="closeModal()">${ICONS.close}</button>
      </div>
      <form id="productForm" onsubmit="saveProduct(event)">
        <div class="m-body">
          <div class="field"><label>Product name</label><input type="text" id="f_name" required></div>
          <div class="field-row">
            <div class="field"><label>SKU</label><input type="text" id="f_sku"></div>
            <div class="field"><label>Category</label>
              <select id="f_category">${DB.categories.map(c=>`<option>${c.name}</option>`).join("")}</select>
            </div>
          </div>
          <div class="field-row">
            <div class="field"><label>Price (${DB.store.currency})</label><input type="number" id="f_price" min="0" required></div>
            <div class="field"><label>Stock quantity</label><input type="number" id="f_stock" min="0" required></div>
          </div>
          <div class="field"><label>Status</label>
            <select id="f_status">
              <option value="active">Active</option>
              <option value="draft">Draft</option>
              <option value="low">Low stock</option>
              <option value="out">Out of stock</option>
            </select>
          </div>
          <div class="field">
            <label>Product Image URL</label>
            <div style="display:flex;gap:12px;align-items:flex-start">
              <div id="imgPreviewBox" class="img-preview-box">
                <span id="imgPreviewPlaceholder">📦</span>
                <img id="imgPreview" src="" alt="Preview" style="display:none">
              </div>
              <div style="flex:1">
                <input type="text" id="f_image" placeholder="https://images.unsplash.com/... or /images/prod_mango.webp">
                <div class="hint">Paste any image URL (e.g. from Unsplash or <code>/images/prod_...</code>).</div>
                <div class="url-chips">
                  <span class="url-chip" onclick="setPresetImg('/images/prod_mango.webp')">🥭 Mango</span>
                  <span class="url-chip" onclick="setPresetImg('/images/prod_tomatoes.webp')">🍅 Tomato</span>
                  <span class="url-chip" onclick="setPresetImg('/images/prod_milk.webp')">🥛 Milk</span>
                  <span class="url-chip" onclick="setPresetImg('/images/prod_sourdough.webp')">🍞 Bread</span>
                  <span class="url-chip" onclick="setPresetImg('/images/prod_strawberries.webp')">🍓 Berry</span>
                  <span class="url-chip" onclick="setPresetImg('/images/prod_avocado.webp')">🥑 Avocado</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="m-foot">
          <button type="button" class="btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn primary">Save product</button>
        </div>
      </form>
    </div>
  </div>
`;

// Wire live typing in Image URL field to live preview
const imgInput = document.getElementById("f_image");
if (imgInput) {
  imgInput.addEventListener("input", (e) => updateImgPreview(e.target.value.trim()));
}

// URL Search parameter support (e.g. ?q=organic)
const urlParams = new URLSearchParams(window.location.search);
const initialQuery = urlParams.get("q") || urlParams.get("search");
if (initialQuery) {
  filterText = initialQuery.toLowerCase();
  const searchEl = document.getElementById("searchInput");
  if (searchEl) searchEl.value = initialQuery;
  const globalEl = document.getElementById("globalSearch");
  if (globalEl) globalEl.value = initialQuery;
}

renderTable();
document.getElementById("searchInput").addEventListener("input", e=>{ filterText = e.target.value.toLowerCase(); renderTable(); });
document.getElementById("catFilter").addEventListener("change", e=>{ filterCat = e.target.value; renderTable(); });
</script>
</body>
</html>
