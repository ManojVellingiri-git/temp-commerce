<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coupons · Gurkhacamp Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
renderShell("coupons.html", "Coupons");

let editCode = null;

function openEdit(code){
  editCode = code;
  const c = DB.coupons.find(x=>x.code===code);
  document.getElementById("modalTitle").textContent = c ? "Edit coupon" : "Add coupon";
  document.getElementById("f_code").value = c ? c.code : "";
  document.getElementById("f_type").value = c ? c.type : "Percent";
  document.getElementById("f_value").value = c ? c.value : "";
  document.getElementById("f_min").value = c ? c.minOrder : "";
  document.getElementById("f_limit").value = c ? c.limit : "";
  document.getElementById("f_expires").value = c ? c.expires : "";
  document.getElementById("f_status").value = c ? c.status : "active";
  document.getElementById("modalOverlay").classList.add("open");
}
function closeModal(){ document.getElementById("modalOverlay").classList.remove("open"); }

function saveCoupon(e){
  e.preventDefault();
  const payload = {
    code: document.getElementById("f_code").value.trim().toUpperCase(),
    type: document.getElementById("f_type").value,
    value: Number(document.getElementById("f_value").value||0),
    minOrder: Number(document.getElementById("f_min").value||0),
    limit: Number(document.getElementById("f_limit").value||0),
    expires: document.getElementById("f_expires").value,
    status: document.getElementById("f_status").value
  };
  if (!payload.code) return;
  if (editCode){
    const c = DB.coupons.find(x=>x.code===editCode);
    Object.assign(c, payload, { used: c.used });
    showToast("Coupon updated");
  } else {
    payload.used = 0;
    DB.coupons.unshift(payload);
    showToast("Coupon created");
  }
  persist();
  closeModal();
  renderTable();
}

function removeCoupon(code){
  if (!confirm("Delete this coupon?")) return;
  DB.coupons = DB.coupons.filter(c=>c.code!==code);
  persist();
  renderTable();
  showToast("Coupon deleted");
}

function renderTable(){
  document.getElementById("tbody").innerHTML = DB.coupons.map(c => `
    <tr>
      <td><b>${c.code}</b></td>
      <td>${c.type==="Percent" ? c.value+"% off" : fmtMoney(c.value)+" off"}</td>
      <td>${fmtMoney(c.minOrder)}</td>
      <td>${c.used} / ${c.limit}</td>
      <td>${c.expires}</td>
      <td>${statusPill(c.status)}</td>
      <td>
        <div class="row-actions">
          <button class="icon-mini" onclick="openEdit('${c.code}')">${ICONS.edit}</button>
          <button class="icon-mini" onclick="removeCoupon('${c.code}')">${ICONS.trash}</button>
        </div>
      </td>
    </tr>
  `).join("");
}

document.getElementById("pageContent").innerHTML = `
  <div class="page-head">
    <div>
      <div class="crumbs">Sales / Coupons</div>
      <h1>Coupons &amp; offers</h1>
      <p>Create discount codes and track redemptions.</p>
    </div>
    <button class="btn primary" onclick="openEdit(null)">${ICONS.plus} New coupon</button>
  </div>

  <div class="panel">
    <table>
      <thead><tr><th>Code</th><th>Discount</th><th>Min. order</th><th>Usage</th><th>Expires</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="m-head"><h3 id="modalTitle">New coupon</h3><button class="close-x" onclick="closeModal()">${ICONS.close}</button></div>
      <form onsubmit="saveCoupon(event)">
        <div class="m-body">
          <div class="field"><label>Coupon code</label><input type="text" id="f_code" style="text-transform:uppercase" required></div>
          <div class="field-row">
            <div class="field"><label>Type</label>
              <select id="f_type"><option>Percent</option><option>Flat ₹</option></select>
            </div>
            <div class="field"><label>Value</label><input type="number" id="f_value" min="0" required></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Min. order (${DB.store.currency})</label><input type="number" id="f_min" min="0"></div>
            <div class="field"><label>Usage limit</label><input type="number" id="f_limit" min="0"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Expires on</label><input type="date" id="f_expires"></div>
            <div class="field"><label>Status</label>
              <select id="f_status"><option value="active">Active</option><option value="paused">Paused</option><option value="expired">Expired</option></select>
            </div>
          </div>
        </div>
        <div class="m-foot">
          <button type="button" class="btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn primary">Save coupon</button>
        </div>
      </form>
    </div>
  </div>
`;

renderTable();
</script>
</body>
</html>
